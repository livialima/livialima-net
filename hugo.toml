baseURL = "https://livialima.net/"
languageCode = "en-us"
title = "Livia Lima"
theme = "PaperMod"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = true
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.assets]
    favicon = "/img/LL.gif"
    favicon16x16 = "/img/LL.gif"
    favicon32x32 = "/img/LL.gif"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/livialima"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/livialima/"

  [[params.socialIcons]]
    name = "youtube"
    url = "https://www.youtube.com/@livia2lima"

  [[params.socialIcons]]
    name = "mastodon"
    url = "https://fosstodon.org/@livialima"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 15

  [[menu.main]]
    identifier = "notes"
    name = "Notes"
    url = "/notes/"
    weight = 20

  [[menu.main]]
    identifier = "impossible-list"
    name = "Impossible List"
    url = "/impossible-list/"
    weight = 30

  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"